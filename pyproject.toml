[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nwis"
version = "0.1.0"
description = "Nearby Wells Intelligence System for Oil India Limited"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.14.4",
    "shapely>=2.0.3",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.5",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "domain", "database", "config", "infrastructure"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
